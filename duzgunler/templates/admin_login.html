<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Düzgünler Elektrik | B2B Yönetim Girişi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <div class="mb-6 text-center">
      <span class="inline-block px-3 py-1 text-xs font-semibold tracking-wider uppercase bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full mb-3">
        B2B Merkez Yönetim
      </span>
      <h1 class="text-2xl font-bold text-white">Düzgünler Elektrik</h1>
      <p class="text-sm text-slate-400 mt-1">Bayi, plasiyer, stok ve sipariş yönetim paneli</p>
    </div>

    {% if error %}
      <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-300 text-sm">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="{{ url_for('duzgunler.admin_login') }}" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Yönetici Kullanıcı Adı</label>
        <input type="text" name="username" required autocomplete="username"
               class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-white focus:outline-none focus:border-amber-400">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Şifre</label>
        <input type="password" name="password" required autocomplete="current-password"
               class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-white focus:outline-none focus:border-amber-400">
      </div>
      <button type="submit"
              class="w-full py-2.5 px-4 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold transition">
        Yönetim Paneline Gir
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="{{ url_for('duzgunler.index') }}" class="text-xs text-slate-400 hover:text-amber-400">
        ← Düzgünler B2B Ana Sayfasına Dön
      </a>
    </div>
  </div>
</body>
</html>
